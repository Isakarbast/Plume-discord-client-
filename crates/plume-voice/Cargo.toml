[package]
name = "plume-voice"
version.workspace = true
edition.workspace = true

[dependencies]
plume-core.workspace = true
cpal = "0.18"
# Pure-Rust DAVE (Discord's end-to-end voice encryption), so no C++ libdave.
davey = "0.1.5"
futures-util.workspace = true
# Builds libopus from source with CMake, so no system library is needed.
opus = "0.4"
# RNNoise in pure Rust: noise suppression for the microphone.
nnnoiseless = { version = "0.5", default-features = false }
ring = "0.17"
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
