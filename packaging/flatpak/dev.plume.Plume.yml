# Flatpak build. Before building, generate the offline crate list:
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
# (from https://github.com/flatpak/flatpak-builder-tools/tree/master/cargo), then:
#   flatpak-builder --user --install build-dir packaging/flatpak/dev.plume.Plume.yml
app-id: dev.plume.Plume
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: plume
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Voice calls: microphone and speakers.
  - --socket=pulseaudio
  # Keyring (token storage) and notifications.
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/plume/cargo
modules:
  - name: plume
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml
      - cargo --offline build --release -p plume-gtk
      - install -Dm755 target/release/plume /app/bin/plume
      - install -Dm644 packaging/dev.plume.Plume.desktop /app/share/applications/dev.plume.Plume.desktop
      - install -Dm644 packaging/dev.plume.Plume.metainfo.xml /app/share/metainfo/dev.plume.Plume.metainfo.xml
      - install -Dm644 assets/icons/dev.plume.Plume.svg /app/share/icons/hicolor/scalable/apps/dev.plume.Plume.svg
    sources:
      - type: dir
        path: ../..
      - cargo-sources.json
